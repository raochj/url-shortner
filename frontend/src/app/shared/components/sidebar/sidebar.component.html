<nav class="sidebar">
  <div class="nav-section">
    <p class="nav-section-title">Navigation</p>
    <!-- Dashboard -->
    <a
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item"
    >
      <span class="nav-icon">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="3" y="3" width="7" height="7" />
          <rect x="14" y="3" width="7" height="7" />
          <rect x="14" y="14" width="7" height="7" />
          <rect x="3" y="14" width="7" height="7" />
        </svg>
      </span>
      Dashboard
    </a>
    <!-- My URLs -->
    <a
      routerLink="/urls"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item"
    >
      <span class="nav-icon">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
          />
          <path
            d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
          />
        </svg>
      </span>
      My URLs
    </a>
    <!-- Create Short URL -->
    <a routerLink="/urls/new" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="16" />
          <line x1="8" y1="12" x2="16" y2="12" />
        </svg>
      </span>
      Create Short URL
    </a>
    <!-- Analytics (shown when shortCode provided) -->
    <a
      *ngIf="currentShortCode"
      [routerLink]="['/analytics', currentShortCode]"
      routerLinkActive="active"
      class="nav-item"
    >
      <span class="nav-icon">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <line x1="18" y1="20" x2="18" y2="10" />
          <line x1="12" y1="20" x2="12" y2="4" />
          <line x1="6" y1="20" x2="6" y2="14" />
        </svg>
      </span>
      Analytics
      <span class="nav-badge">{{ currentShortCode }}</span>
    </a>
    <div class="nav-divider"></div>
    <!-- Orchestration -->
    <a routerLink="/orchestration" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="3" />
          <path
            d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"
          />
        </svg>
      </span>
      Orchestration
    </a>
  </div>
  <div class="sidebar-footer">
    <p class="version-info">Schwab URL Shortener v1.0</p>
  </div>
</nav>
